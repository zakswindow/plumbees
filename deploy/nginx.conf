# /etc/nginx/conf.d/plumbees.conf   (TLS certificates via certbot or ACM-terminated ALB)
limit_req_zone $binary_remote_addr zone=quote:10m rate=10r/m;

server {
  listen 80;
  server_name plumbees.co.uk www.plumbees.co.uk;
  return 301 https://www.plumbees.co.uk$request_uri;
}

server {
  listen 443 ssl;
  http2 on;
  server_name www.plumbees.co.uk;

  ssl_certificate     /etc/letsencrypt/live/www.plumbees.co.uk/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/www.plumbees.co.uk/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  server_tokens off;
  client_max_body_size 32k;

  location /api/quote {
    limit_req zone=quote burst=5 nodelay;
    proxy_pass http://127.0.0.1:3000;
    proxy_set_header Host $host;
    # Overwrite, never append, so clients cannot spoof their address.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
