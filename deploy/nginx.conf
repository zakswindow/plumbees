# /etc/nginx/conf.d/plumbees.conf
# Cloudflare proxies the site. HTTPS to the origin uses a Cloudflare Origin certificate,
# the same approach as heatingology.co.uk.
#   /etc/nginx/ssl/plumbees.co.uk.pem   (certificate)
#   /etc/nginx/ssl/plumbees.key         (private key, chmod 600, owned by root)

# Behind Cloudflare every request arrives from a Cloudflare address, so rate limits must use
# the visitor address Cloudflare passes on.
map $http_cf_connecting_ip $plumbees_client_ip {
    default $http_cf_connecting_ip;
    ""      $remote_addr;
}

limit_req_zone $plumbees_client_ip zone=plumbees_book:10m   rate=10r/m;
limit_req_zone $plumbees_client_ip zone=plumbees_lookup:10m rate=120r/m;

server {
    listen 80;
    listen [::]:80;
    server_name plumbees.co.uk www.plumbees.co.uk;
    return 301 https://www.plumbees.co.uk$request_uri;
}

# Bare domain to www
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name plumbees.co.uk;

    ssl_certificate     /etc/nginx/ssl/plumbees.co.uk.pem;
    ssl_certificate_key /etc/nginx/ssl/plumbees.key;
    return 301 https://www.plumbees.co.uk$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.plumbees.co.uk;

    ssl_certificate     /etc/nginx/ssl/plumbees.co.uk.pem;
    ssl_certificate_key /etc/nginx/ssl/plumbees.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    server_tokens off;
    client_max_body_size 32k;

    # Security headers (HSTS, CSP and the rest) are set by the application itself.
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # Overwrite, never append, so a visitor cannot choose their own address.
    proxy_set_header X-Forwarded-For $plumbees_client_ip;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;

    location = /api/quote {
        limit_req zone=plumbees_book burst=5 nodelay;
        proxy_pass http://127.0.0.1:3000;
    }

    location /api/postcode/ {
        limit_req zone=plumbees_lookup burst=40 nodelay;
        proxy_pass http://127.0.0.1:3000;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
    }
}
