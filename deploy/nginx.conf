# /etc/nginx/sites-available/plumbees   (installed by scripts/server-setup.sh, symlinked into sites-enabled)
#
# Built to sit beside the heatingology site from scripts/server/setup.sh in the Heatingology repo:
#  - it does NOT declare default_server (heatingology's catch-all already answers unknown hosts with 444)
#  - zone and snippet names all start with "plumbees" so nothing can clash
#  - the real visitor address already arrives in $remote_addr, because heatingology's
#    00-cloudflare-realip.conf restores it from CF-Connecting-IP for every site
#  - HTTP/2 uses "listen ... http2", which works on every Ubuntu nginx (the "http2 on;" directive does not)

limit_req_zone $binary_remote_addr zone=plumbees_site:10m   rate=20r/s;
limit_req_zone $binary_remote_addr zone=plumbees_book:10m   rate=10r/m;
limit_req_zone $binary_remote_addr zone=plumbees_lookup:10m rate=120r/m;

# Plain HTTP is only ever sent on to HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name plumbees.co.uk www.plumbees.co.uk;
    return 301 https://www.plumbees.co.uk$request_uri;
}

# Bare domain to www
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name plumbees.co.uk;
    include snippets/plumbees-tls.conf;
    #PLUMBEES_AOP#
    return 301 https://www.plumbees.co.uk$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.plumbees.co.uk;
    include snippets/plumbees-tls.conf;
    #PLUMBEES_AOP#

    # HSTS and the other security headers are set by the application itself.
    client_max_body_size 32k;
    limit_req zone=plumbees_site burst=60 nodelay;

    # Never serve hidden files or version-control folders.
    location ~ /\.(?!well-known) { return 404; }

    location = /api/quote {
        limit_req zone=plumbees_book burst=5 nodelay;
        include snippets/plumbees-proxy.conf;
    }

    location /api/postcode/ {
        limit_req zone=plumbees_lookup burst=40 nodelay;
        include snippets/plumbees-proxy.conf;
    }

    location / {
        include snippets/plumbees-proxy.conf;
    }
}
